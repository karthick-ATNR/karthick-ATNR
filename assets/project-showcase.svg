<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="230" viewBox="0 0 1100 230" role="img" aria-labelledby="t d">
<title id="t">Selected software projects</title><desc id="d">Three refined project cards for CRM integration, inventory management, and e-commerce.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a1020"/><stop offset="1" stop-color="#14243a"/></linearGradient>
 <linearGradient id="line"><stop stop-color="#8b5cf6"/><stop offset=".5" stop-color="#38bdf8"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
 <style>
 .sans{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,monospace}
 .card{fill:#111d31;stroke:#33445f;stroke-width:1}
 .top{animation:shine 5s ease-in-out infinite}.two{animation-delay:1.3s}.three{animation-delay:2.6s}
 .float{animation:float 6s ease-in-out infinite}.float2{animation:float 6s ease-in-out -2s infinite}
 @keyframes shine{0%,100%{opacity:.35}50%{opacity:1}}@keyframes float{50%{transform:translateY(-4px)}}
 </style>
</defs>
<rect width="1100" height="230" rx="20" fill="url(#bg)" stroke="#293c56"/>
<g transform="translate(22 22)">
 <rect width="340" height="186" rx="15" class="card"/>
 <rect width="340" height="3" rx="1.5" fill="url(#line)" class="top"/>
 <circle cx="42" cy="48" r="22" fill="#29214b" stroke="#8b5cf6"/>
 <text x="42" y="54" text-anchor="middle" class="mono" font-size="16" fill="#ddd6fe">01</text>
 <text x="78" y="43" class="sans" font-size="17" font-weight="700" fill="#f1f5f9">CRM ↔ Xero Integration</text>
 <text x="78" y="64" class="mono" font-size="10" fill="#a78bfa">BACKEND INTEGRATION</text>
 <text x="25" y="111" class="sans" font-size="13" fill="#b8c6d9">Connecting business platforms</text>
 <text x="25" y="132" class="sans" font-size="13" fill="#b8c6d9">through secure API workflows.</text>
 <text x="25" y="164" class="mono" font-size="11" fill="#7dd3fc">NestJS · OAuth 2.0 · REST</text>
 <path d="M25 180H315" stroke="#263b55"/>
</g>
<g transform="translate(380 22)" class="float">
 <rect width="340" height="186" rx="15" class="card"/>
 <rect width="340" height="3" rx="1.5" fill="url(#line)" class="top two"/>
 <circle cx="42" cy="48" r="22" fill="#123b3c" stroke="#2dd4bf"/>
 <text x="42" y="54" text-anchor="middle" class="mono" font-size="16" fill="#99f6e4">02</text>
 <text x="78" y="43" class="sans" font-size="17" font-weight="700" fill="#f1f5f9">Inventory Management</text>
 <text x="78" y="64" class="mono" font-size="10" fill="#5eead4">BUSINESS APPLICATION</text>
 <text x="25" y="111" class="sans" font-size="13" fill="#b8c6d9">Managing products, stock,</text>
 <text x="25" y="132" class="sans" font-size="13" fill="#b8c6d9">suppliers and role-based access.</text>
 <text x="25" y="164" class="mono" font-size="11" fill="#7dd3fc">NestJS · PostgreSQL · Docker</text>
 <path d="M25 180H315" stroke="#263b55"/>
</g>
<g transform="translate(738 22)" class="float2">
 <rect width="340" height="186" rx="15" class="card"/>
 <rect width="340" height="3" rx="1.5" fill="url(#line)" class="top three"/>
 <circle cx="42" cy="48" r="22" fill="#12324a" stroke="#38bdf8"/>
 <text x="42" y="54" text-anchor="middle" class="mono" font-size="16" fill="#bae6fd">03</text>
 <text x="78" y="43" class="sans" font-size="17" font-weight="700" fill="#f1f5f9">K-Shop E-Commerce</text>
 <text x="78" y="64" class="mono" font-size="10" fill="#7dd3fc">FRONTEND APPLICATION</text>
 <text x="25" y="111" class="sans" font-size="13" fill="#b8c6d9">Product-focused shopping</text>
 <text x="25" y="132" class="sans" font-size="13" fill="#b8c6d9">interface with React components.</text>
 <text x="25" y="164" class="mono" font-size="11" fill="#7dd3fc">React · JavaScript · CSS</text>
 <path d="M25 180H315" stroke="#263b55"/>
</g>
</svg>