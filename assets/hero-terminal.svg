<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Karthick E | Software Developer</title>
<desc id="desc">Premium animated developer portfolio banner in midnight blue with violet and cyan accents.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d1b"/><stop offset=".58" stop-color="#111b35"/><stop offset="1" stop-color="#102b3b"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8b5cf6"/><stop offset=".52" stop-color="#38bdf8"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#6366f1" stop-opacity=".3"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
 <style>
 .sans{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,monospace}
 .sub{fill:#a8b5ca}.tiny{fill:#8293ad}
 .orbit{fill:none;stroke:#64748b;stroke-opacity:.38;stroke-width:1.2;stroke-dasharray:3 9;transform-origin:930px 190px;animation:spin 32s linear infinite}
 .orbit2{fill:none;stroke:#38bdf8;stroke-opacity:.4;stroke-width:1.5;transform-origin:930px 190px;animation:spin 22s linear infinite reverse}
 .float{animation:float 5s ease-in-out infinite}.float2{animation:float 6s ease-in-out -2s infinite}
 .pulse{animation:pulse 3s ease-in-out infinite}.cursor{animation:blink 1s steps(2,start) infinite}
 .intro{animation:rise .9s both}.i2{animation-delay:.2s}.i3{animation-delay:.45s}.i4{animation-delay:.7s}
 @keyframes spin{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-9px)}}
 @keyframes pulse{50%{opacity:.55}}@keyframes blink{to{opacity:0}}
 @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
 </style>
</defs>
<rect width="1200" height="390" rx="24" fill="url(#bg)"/>
<circle cx="950" cy="185" r="245" fill="url(#halo)" filter="url(#blur)"/>
<circle cx="150" cy="360" r="170" fill="#0e7490" opacity=".12" filter="url(#blur)"/>
<g opacity=".12" stroke="#94a3b8" stroke-width="1">
 <path d="M0 78H1200M0 156H1200M0 234H1200M0 312H1200"/>
 <path d="M100 0V390M200 0V390M300 0V390M400 0V390M500 0V390M600 0V390M700 0V390M800 0V390M900 0V390M1000 0V390M1100 0V390"/>
</g>
<rect x="1" y="1" width="1198" height="388" rx="23" fill="none" stroke="#53627f" stroke-opacity=".55"/>
<g transform="translate(66 67)">
 <rect width="164" height="29" rx="14.5" fill="#17233d" stroke="#344766"/>
 <circle cx="17" cy="14.5" r="4" fill="#34d399" class="pulse"/>
 <text x="30" y="19" class="mono" font-size="11" fill="#c7d2e5" letter-spacing="1.2">DEVELOPER PORTFOLIO</text>
 <text y="104" class="sans intro" font-size="65" font-weight="750" letter-spacing="-2" fill="#f8fafc">Karthick E</text>
 <rect y="122" width="78" height="4" rx="2" fill="url(#accent)"/>
 <text y="163" class="sans sub intro i2" font-size="21">Backend Development · API Integrations</text>
 <text y="202" class="sans tiny intro i3" font-size="16">Building practical software with clean architecture</text>
 <g class="mono intro i4" font-size="14">
  <text y="257" fill="#a78bfa">NestJS</text><text x="74" y="257" fill="#64748b">/</text>
  <text x="91" y="257" fill="#7dd3fc">TypeScript</text><text x="190" y="257" fill="#64748b">/</text>
  <text x="207" y="257" fill="#5eead4">PostgreSQL</text>
 </g>
 <text y="303" class="mono" font-size="13" fill="#8da1ba">$ always_learning<span class="cursor" fill="#67e8f9">_</span></text>
</g>
<g>
 <circle cx="930" cy="190" r="144" class="orbit"/>
 <circle cx="930" cy="190" r="112" class="orbit2"/>
 <circle cx="930" cy="190" r="78" fill="#101b31" stroke="#344766" stroke-width="1.5"/>
 <circle cx="930" cy="190" r="68" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="90 25 42 25" class="orbit2"/>
 <text x="930" y="202" text-anchor="middle" class="sans" fill="#f8fafc" font-size="39" font-weight="700">KE</text>
 <g class="float">
  <rect x="830" y="30" width="124" height="38" rx="10" fill="#17233d" stroke="#425477"/>
  <circle cx="848" cy="49" r="5" fill="#8b5cf6"/><text x="861" y="54" class="mono" font-size="12" fill="#dbeafe">NestJS API</text>
 </g>
 <g class="float2">
  <rect x="1015" y="116" width="126" height="38" rx="10" fill="#17233d" stroke="#345c68"/>
  <circle cx="1033" cy="135" r="5" fill="#2dd4bf"/><text x="1046" y="140" class="mono" font-size="12" fill="#dbeafe">PostgreSQL</text>
 </g>
 <g class="float">
  <rect x="834" y="302" width="120" height="38" rx="10" fill="#17233d" stroke="#425477"/>
  <circle cx="852" cy="321" r="5" fill="#38bdf8"/><text x="865" y="326" class="mono" font-size="12" fill="#dbeafe">AI + MCP</text>
 </g>
 <g class="pulse">
  <circle cx="930" cy="46" r="5" fill="#a78bfa" filter="url(#glow)"/>
  <circle cx="1074" cy="190" r="5" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="930" cy="334" r="5" fill="#2dd4bf" filter="url(#glow)"/>
 </g>
</g>
<text x="1135" y="365" text-anchor="end" class="mono" fill="#64748b" font-size="10" letter-spacing="1">LEARN · BUILD · IMPROVE</text>
</svg>