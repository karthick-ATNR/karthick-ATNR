<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Karthick E — Backend Developer</title>
  <desc id="desc">Animated midnight terminal portfolio banner with glowing network nodes and a typing cursor.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset=".55" stop-color="#0b1d31"/><stop offset="1" stop-color="#102d3b"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#22d3ee" stop-opacity=".28"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#14b8a6" stop-opacity=".28"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
    <style>
      .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}
      .sans{font-family:Arial,Helvetica,sans-serif}
      .muted{fill:#8aa3b8}
      .cyan{fill:#67e8f9}
      .green{fill:#6ee7b7}
      .line{stroke:#1d4053;stroke-width:1}
      .blink{animation:blink 1s steps(2,start) infinite}
      .float{animation:float 6s ease-in-out infinite}
      .float2{animation:float 7s ease-in-out -2s infinite}
      .pulse{animation:pulse 3s ease-in-out infinite}
      .scan{animation:scan 7s linear infinite}
      .dash{stroke-dasharray:7 11;animation:dash 14s linear infinite}
      .reveal1{animation:reveal 1s .2s both}
      .reveal2{animation:reveal 1s .6s both}
      .reveal3{animation:reveal 1s 1s both}
      .reveal4{animation:reveal 1s 1.4s both}
      @keyframes blink{to{opacity:0}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
      @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
      @keyframes scan{0%{transform:translateY(-20px)}100%{transform:translateY(450px)}}
      @keyframes dash{to{stroke-dashoffset:-180}}
      @keyframes reveal{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
    </style>
  </defs>
  <rect width="1200" height="430" rx="26" fill="url(#bg)"/>
  <circle cx="1010" cy="80" r="230" fill="url(#glow)" filter="url(#blur)"/>
  <circle cx="150" cy="390" r="190" fill="#0e7490" opacity=".13" filter="url(#blur)"/>
  <g opacity=".14" stroke="#5eead4" stroke-width="1">
    <path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200M0 350H1200"/>
    <path d="M100 0V430M200 0V430M300 0V430M400 0V430M500 0V430M600 0V430M700 0V430M800 0V430M900 0V430M1000 0V430M1100 0V430"/>
  </g>
  <rect x="1" y="1" width="1198" height="428" rx="25" fill="none" stroke="url(#edge)" stroke-opacity=".55"/>
  <g transform="translate(48 42)">
    <rect width="1104" height="346" rx="18" fill="#07101c" fill-opacity=".72" stroke="#29485a"/>
    <path d="M0 54H1104" class="line"/>
    <circle cx="26" cy="27" r="6" fill="#fb7185"/><circle cx="48" cy="27" r="6" fill="#fbbf24"/><circle cx="70" cy="27" r="6" fill="#34d399"/>
    <text x="552" y="32" text-anchor="middle" class="mono muted" font-size="13">karthick@developer: ~/profile</text>
    <g transform="translate(42 94)">
      <text class="mono green" font-size="15">$ whoami</text>
      <text y="55" class="sans" fill="#f8fafc" font-size="49" font-weight="700" letter-spacing="1">KARTHICK E</text>
      <rect x="1" y="72" width="68" height="3" rx="2" fill="url(#edge)"/>
      <text y="111" class="sans" fill="#c5d5e2" font-size="19">Backend Development  ·  REST API Integration</text>
      <g class="mono" font-size="15">
        <text y="163" class="cyan reveal1">const focus = [</text>
        <text x="18" y="191" class="muted reveal2">"NestJS", "TypeScript", "PostgreSQL",</text>
        <text x="18" y="219" class="muted reveal3">"AI Agents", "MCP", "n8n"</text>
        <text y="247" class="cyan reveal4">];</text>
        <text y="290" class="green">$ <tspan fill="#e2e8f0">building useful things, one commit at a time</tspan><tspan class="blink" fill="#67e8f9">_</tspan></text>
      </g>
    </g>
    <g transform="translate(830 98)" class="float">
      <circle cx="112" cy="112" r="103" fill="none" stroke="#164e63" stroke-width="1.5" class="dash"/>
      <circle cx="112" cy="112" r="77" fill="none" stroke="#0f766e" stroke-opacity=".65" stroke-width="1.5"/>
      <circle cx="112" cy="112" r="53" fill="#0e7490" opacity=".12"/>
      <circle cx="112" cy="112" r="34" fill="#0b2534" stroke="url(#edge)" stroke-width="2"/>
      <text x="112" y="119" text-anchor="middle" class="mono cyan" font-size="23" font-weight="700">KE</text>
      <g class="pulse">
        <circle cx="112" cy="9" r="7" fill="#67e8f9"/><circle cx="215" cy="112" r="6" fill="#6ee7b7"/>
        <circle cx="112" cy="215" r="6" fill="#67e8f9"/><circle cx="9" cy="112" r="6" fill="#6ee7b7"/>
      </g>
      <g class="float2">
        <rect x="2" y="244" width="220" height="44" rx="10" fill="#0b2534" stroke="#1e5262"/>
        <circle cx="22" cy="266" r="5" fill="#34d399"/>
        <text x="36" y="271" class="mono" fill="#b7cbd8" font-size="12">SYSTEM STATUS: LEARNING</text>
      </g>
    </g>
    <rect x="0" y="0" width="1104" height="346" rx="18" fill="url(#shine)" opacity=".22" class="scan"/>
  </g>
  <text x="1150" y="410" text-anchor="end" class="mono" fill="#648398" font-size="11">ENGINEERED WITH CURIOSITY  /  2026</text>
</svg>