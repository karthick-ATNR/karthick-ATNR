<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="260" viewBox="0 0 1100 260" role="img" aria-labelledby="t d">
<title id="t">API integration architecture</title><desc id="d">Animated data flow between Zoho CRM, a NestJS integration service, and Xero.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081321"/><stop offset="1" stop-color="#102b3b"/></linearGradient>
 <linearGradient id="a"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/></linearGradient>
 <style>
 .m{font-family:Consolas,monospace}.h{font-family:Arial,sans-serif;font-weight:700}
 .route{fill:none;stroke:#256477;stroke-width:2;stroke-dasharray:8 10;animation:move 2.2s linear infinite}
 .dot{fill:#67e8f9;filter:url(#g);animation:travel 3s linear infinite}
 .dot2{animation-delay:1.5s}
 .node{animation:breathe 3.5s ease-in-out infinite}
 @keyframes move{to{stroke-dashoffset:-36}}
 @keyframes travel{0%{transform:translateX(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(350px);opacity:0}}
 @keyframes breathe{0%,100%{stroke:#24566a}50%{stroke:#2dd4bf}}
 </style>
 <filter id="g"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<rect width="1100" height="260" rx="20" fill="url(#bg)" stroke="#1e4658"/>
<text x="38" y="39" class="m" fill="#7dd3fc" font-size="13">INTEGRATION FLOW / REST API</text>
<g transform="translate(38 75)">
 <rect width="245" height="125" rx="15" fill="#0d2232" stroke="#246078" class="node"/>
 <text x="122" y="49" text-anchor="middle" class="h" fill="#e2e8f0" font-size="22">Zoho CRM</text>
 <text x="122" y="78" text-anchor="middle" class="m" fill="#8da9bb" font-size="13">Contacts · Leads</text>
 <text x="122" y="101" text-anchor="middle" class="m" fill="#34d399" font-size="11">SOURCE SYSTEM</text>
</g>
<path d="M283 137H420M680 137H817" class="route"/>
<circle cx="283" cy="137" r="4" class="dot"/><circle cx="283" cy="137" r="4" class="dot dot2"/>
<g transform="translate(420 75)">
 <rect width="260" height="125" rx="15" fill="#0c2b35" stroke="#2dd4bf" stroke-opacity=".8" class="node"/>
 <text x="130" y="49" text-anchor="middle" class="h" fill="#f0fdfa" font-size="22">NestJS API</text>
 <text x="130" y="78" text-anchor="middle" class="m" fill="#a5c6cb" font-size="13">Validation · Mapping</text>
 <text x="130" y="101" text-anchor="middle" class="m" fill="#67e8f9" font-size="11">INTEGRATION LAYER</text>
</g>
<g transform="translate(817 75)">
 <rect width="245" height="125" rx="15" fill="#0d2232" stroke="#246078" class="node"/>
 <text x="122" y="49" text-anchor="middle" class="h" fill="#e2e8f0" font-size="22">Xero</text>
 <text x="122" y="78" text-anchor="middle" class="m" fill="#8da9bb" font-size="13">Accounting platform</text>
 <text x="122" y="101" text-anchor="middle" class="m" fill="#34d399" font-size="11">TARGET SYSTEM</text>
</g>
<text x="350" y="119" text-anchor="middle" class="m" fill="#8da9bb" font-size="11">OAuth 2.0</text>
<text x="750" y="119" text-anchor="middle" class="m" fill="#8da9bb" font-size="11">API request</text>
<text x="550" y="235" text-anchor="middle" class="m" fill="#6b8798" font-size="12">Conceptual architecture from integration project work</text>
</svg>