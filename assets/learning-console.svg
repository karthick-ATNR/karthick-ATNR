<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="190" viewBox="0 0 1100 190" role="img" aria-labelledby="t d">
<title id="t">Current learning focus</title><desc id="d">A minimal animated console listing backend, database, API, and AI learning areas.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a1020"/><stop offset="1" stop-color="#14243a"/></linearGradient>
 <linearGradient id="acc"><stop stop-color="#8b5cf6"/><stop offset=".5" stop-color="#38bdf8"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
 <style>
 .m{font-family:Consolas,monospace}.s{font-family:Inter,Segoe UI,Arial,sans-serif}
 .blink{animation:blink 1s steps(2,start) infinite}.fade{animation:fade .8s both}
 .f2{animation-delay:.2s}.f3{animation-delay:.4s}.f4{animation-delay:.6s}
 .glow{animation:glow 3s ease-in-out infinite}
 @keyframes blink{to{opacity:0}}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
 @keyframes glow{50%{opacity:.55}}
 </style>
</defs>
<rect width="1100" height="190" rx="18" fill="url(#bg)" stroke="#293c56"/>
<rect x="1" y="1" width="1098" height="42" rx="17" fill="#14243a"/>
<circle cx="25" cy="22" r="5" fill="#fb7185"/><circle cx="44" cy="22" r="5" fill="#fbbf24"/><circle cx="63" cy="22" r="5" fill="#34d399"/>
<text x="550" y="27" text-anchor="middle" class="m" font-size="12" fill="#91a4bd">~/learning/current-focus</text>
<g transform="translate(36 76)">
 <text class="m" font-size="14" fill="#6ee7b7">$</text>
 <text x="20" class="m" font-size="14" fill="#dbeafe">I enjoy learning by building and testing real applications.</text>
 <text y="38" class="m" font-size="13" fill="#8293ad">FOCUS AREAS</text>
 <g class="s" font-size="13">
  <g class="fade"><rect x="0" y="58" width="235" height="38" rx="9" fill="#17233d" stroke="#4c4380"/><circle cx="18" cy="77" r="4" fill="#a78bfa"/><text x="32" y="82" fill="#e2e8f0">NestJS &amp; TypeScript</text></g>
  <g class="fade f2"><rect x="250" y="58" width="205" height="38" rx="9" fill="#17233d" stroke="#34566e"/><circle cx="268" cy="77" r="4" fill="#38bdf8"/><text x="282" y="82" fill="#e2e8f0">PostgreSQL &amp; SQL</text></g>
  <g class="fade f3"><rect x="470" y="58" width="225" height="38" rx="9" fill="#17233d" stroke="#34566e"/><circle cx="488" cy="77" r="4" fill="#2dd4bf"/><text x="502" y="82" fill="#e2e8f0">REST APIs &amp; OAuth</text></g>
  <g class="fade f4"><rect x="710" y="58" width="318" height="38" rx="9" fill="#17233d" stroke="#4c4380"/><circle cx="728" cy="77" r="4" fill="#a78bfa"/><text x="742" y="82" fill="#e2e8f0">MCP · AI Agents · n8n</text></g>
 </g>
 <text x="0" y="139" class="m" font-size="12" fill="#7dd3fc">keep_learning<span class="blink">_</span></text>
 <rect x="860" y="129" width="168" height="2" rx="1" fill="url(#acc)" class="glow"/>
</g>
</svg>